name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - "Docs/**"
      - AGENTS.md
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - "Docs/**"
      - AGENTS.md
  workflow_dispatch:

# macOS unit tests use the GitHub-hosted xcode-27 runner (macOS, 3-core)
# with Xcode 27.2. That job runs on push to main and on workflow_dispatch.
# Linux runs unit tests and Qdrant v1.20.2 integration tests on pull
# requests, on push, and on workflow_dispatch. Service containers are not
# supported on macOS runners.
# https://docs.github.com/en/actions/using-containerized-services/about-service-containers
# paths-ignore skips docs-only changes. Paths under .github/ are not ignored.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-macos:
    name: Unit tests (Xcode 27.2)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-xcode-27.2-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-xcode-27.2-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swiftpm-${{ runner.os }}-xcode-27.2-
      - name: Resolve packages
        run: swift package resolve
      - name: Unit tests
        run: swift test --skip IntegrationTests

  tests-linux:
    name: Unit and integration tests (Linux, Qdrant v1.20.2)
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.2
        ports:
          - 6333:6333
          - 6334:6334
        env:
          QDRANT__SERVICE__GRPC_PORT: 6334
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s
    env:
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cache Swift toolchain tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .swift-toolchain-cache/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz
          key: swift-tarball-6.4.2-RELEASE-ubuntu24.04
      - name: Install Swift 6.4.2
        run: |
          sudo apt-get update
          # Swift's clang selects the newest GCC. g++-14 provides the C++ headers
          # swift-nio-ssl needs when libstdc++6 is newer than the default g++.
          sudo apt-get install -y libncurses6 libcurl4 libxml2 libpython3.12 build-essential g++-14
          tarball=".swift-toolchain-cache/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz"
          if [ ! -f "$tarball" ]; then
            mkdir -p .swift-toolchain-cache
            curl -fsSL https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz -o "$tarball"
          fi
          sudo mkdir -p /opt
          sudo tar -xzf "$tarball" -C /opt
          echo "/opt/swift-6.4.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-swift-6.4.2-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-6.4.2-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swiftpm-${{ runner.os }}-swift-6.4.2-
      - name: Unit tests
        run: swift test --skip IntegrationTests
      - name: Integration tests
        run: swift test --filter IntegrationTests

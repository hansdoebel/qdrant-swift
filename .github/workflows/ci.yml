name: CI

on:
  push:
    branches: [main]
  pull_request:

# Unit tests run on the self-hosted Xcode 27.2 runner.
# Integration tests run on Linux because GitHub Actions service containers
# are not supported on macOS runners (including self-hosted macOS labels).
# https://docs.github.com/en/actions/using-containerized-services/about-service-containers
jobs:
  unit-macos:
    name: Unit tests (Xcode 27.2)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Resolve packages
        run: swift package resolve
      - name: Unit tests
        run: swift test --skip IntegrationTests

  tests-linux:
    name: Unit and integration tests (Linux, Qdrant v1.20.1)
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.1
        ports:
          - 6333:6333
          - 6334:6334
        env:
          QDRANT__SERVICE__GRPC_PORT: 6334
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s
    env:
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4.2
        run: |
          sudo apt-get update
          # Swift's clang selects the newest GCC. g++-14 provides the C++ headers
          # swift-nio-ssl needs when libstdc++6 is newer than the default g++.
          sudo apt-get install -y libncurses6 libcurl4 libxml2 libpython3.12 build-essential g++-14
          curl -fsSL https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz -o /tmp/swift.tar.gz
          sudo mkdir -p /opt
          sudo tar -xzf /tmp/swift.tar.gz -C /opt
          echo "/opt/swift-6.4.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: swift test --skip IntegrationTests
      - name: Integration tests
        run: swift test --filter IntegrationTests
